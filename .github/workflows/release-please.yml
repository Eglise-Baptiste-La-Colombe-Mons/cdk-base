name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing npm (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing exige npm >= 11.5
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      # yarn pack remplace les dépendances `workspace:` par les versions publiées.
      - name: Pack public workspaces
        run: yarn workspaces foreach --all --no-private exec 'mkdir -p dist && yarn pack --out dist/package.tgz'
      - name: Publish to npm
        run: |
          for tarball in packages/cdk/*/dist/package.tgz; do
            npm publish "$tarball" --access public --provenance
          done
